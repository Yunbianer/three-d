<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <title>立体爱心</title>
        <style>
            body { margin: 0; overflow: hidden; }
            #tip {
                position: fixed; left: 12px; top: 10px;
                color: #ffd6e7; font: 14px/1.6 "Microsoft YaHei", sans-serif;
                text-shadow: 0 1px 4px rgba(0,0,0,.6);
                pointer-events: none;
            }
        </style>
    </head>
    <body>
        <div id="tip">立体爱心 · 鼠标拖拽旋转 · 滚轮缩放</div>
        <script src="libs/three.min.js"></script>
        <script src="libs/OrbitControls.js"></script>
        <script>
            // ===== 场景 / 相机 / 渲染器 =====
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x2b0f3a);       // 深紫夜空底色
            scene.fog = new THREE.Fog(0x2b0f3a, 8, 20);        // 远处渐隐出氛围

            const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
            camera.position.set(0, 2.2, 7);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(innerWidth, innerHeight);
            renderer.setPixelRatio(devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // 鼠标拖拽旋转、滚轮缩放
            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(0, 0.3, 0);
            controls.minDistance = 4;
            controls.maxDistance = 14;

            // ===== 光源：环境光 + 方向光 =====
            scene.add(new THREE.AmbientLight(0xffe3f2, 0.45));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(4, 7, 5);
            scene.add(dirLight);

            // ===== 展台：圆柱底座 =====
            const stage = new THREE.Mesh(
                new THREE.CylinderGeometry(2.2, 2.5, 0.35, 48),
                new THREE.MeshStandardMaterial({ color: 0x5b2a6e, metalness: 0.3, roughness: 0.5 })
            );
            stage.position.y = -1.5;
            scene.add(stage);

            // ===== 主体：立体爱心（贝塞尔曲线描出心形，再挤出厚度）=====
            const heartShape = new THREE.Shape();
            heartShape.moveTo(5, 5);
            heartShape.bezierCurveTo(5, 5, 4, 0, 0, 0);
            heartShape.bezierCurveTo(-6, 0, -6, 7, -6, 7);
            heartShape.bezierCurveTo(-6, 11, -3, 15.4, 5, 19);
            heartShape.bezierCurveTo(12, 15.4, 16, 11, 16, 7);
            heartShape.bezierCurveTo(16, 7, 16, 0, 10, 0);
            heartShape.bezierCurveTo(7, 0, 5, 5, 5, 5);

            const heartGeo = new THREE.ExtrudeGeometry(heartShape, {
                depth: 3,
                bevelEnabled: true,
                bevelThickness: 1,
                bevelSize: 1,
                bevelSegments: 4,
                curveSegments: 32
            });
            heartGeo.center();
            heartGeo.rotateZ(Math.PI);   // 尖端朝下，把爱心摆正
            heartGeo.scale(0.12, 0.12, 0.12);

            const heartMat = new THREE.MeshStandardMaterial({
                color: 0xe91e63,
                metalness: 0.35,
                roughness: 0.25,
                emissive: 0x8e0038,
                emissiveIntensity: 0.35
            });
            const heart = new THREE.Mesh(heartGeo, heartMat);
            heart.position.y = 0.6;

            const heartGroup = new THREE.Group();
            heartGroup.add(heart);
            scene.add(heartGroup);

            // ===== 动画循环：爱心缓慢自转 =====
            const animate = () => {
                requestAnimationFrame(animate);
                heartGroup.rotation.y += 0.006;
                controls.update();
                renderer.render(scene, camera);
            };
            animate();

            // ===== 窗口 resize 适配 =====
            addEventListener('resize', () => {
                camera.aspect = innerWidth / innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(innerWidth, innerHeight);
            });
        </script>
    </body>
</html>
